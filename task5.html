<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media in Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .media-block {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .media-block div {
      flex: 1;
    }
    img {
      width: 100%;
      border: 2px solid #444;
      border-radius: 8px;
    }
    iframe, video {
      width: 100%;
      border-radius: 8px;
    }
    h2 {
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <h1>Adding Media to Webpage</h1>

  <h2>1. Image</h2>
  <img src="https://via.placeholder.com/600x300.png?text=Sample+Image" alt="Sample Image">

  <h2>2. Video (Local/Uploaded)</h2>
  <video controls>
    <source src="your-video.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <h2>3. YouTube Video Embed</h2>
  <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
    title="YouTube video player" frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>

  <h2>4. Media Block Layout (Image + Text)</h2>
  <div class="media-block">
    <div>
      <img src="https://via.placeholder.com/300x200.png?text=Left+Image" alt="Left Block Image">
    </div>
    <div>
      <p>This is a block of text next to the image. You can use it to describe the image or provide context.</p>
    </div>
  </div>

  <h2>5. iFrame (Website Embed)</h2>
  <iframe src="https://www.wikipedia.org/" height="400" width="100%" title="Wikipedia"></iframe>

</body>
</html>
