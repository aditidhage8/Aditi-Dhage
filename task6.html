
<!DOCTYPE html>
<html>
<head>
    <title>Frog Image Layout</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 600px;
            background-color: white;
            border: 1px solid black;
            padding: 10px;
        }

        .top-bar, .bottom-bar {
            height: 40px;
        }

        .top-bar {
            background-color: #4b612c; /* Olive green */
        }

        .bottom-bar {
            background-color: #1f3a64; /* Dark blue */
        }

        .image-section {
            text-align: center;
            margin: 20px 0;
        }

        img {
            width: 400px;
            height: auto;
            border: 1px solid #333;
        }

        .header-table {
            width: 100%;
            border-collapse: collapse;
        }

        .header-table td {
            border: 1px solid black;
            height: 30px;
        }
    </style>
</head>
