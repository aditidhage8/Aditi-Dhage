<!DOCTYPE html>
<html>
<head>
    <title>Image Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

    
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .left-img img {
            width: 200px;
            height: auto;
        }

        .right-box {
            width: 150px;
            height: 200px;
            background-color: deepskyblue;
        }

        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-gap: 10px;
        }

        .grid-container div {
            width: 100px;
            height: 100px;
            background-color: #ccc;
            border: 1px solid #333;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
